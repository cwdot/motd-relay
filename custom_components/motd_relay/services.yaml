publish:
  name: Publish MOTD
  description: >-
    Publish a MOTD status update to MQTT. At least one of `service` or
    `source` must be set. Topic is `<topic_prefix>/<service>-<source>`
    when both are given, otherwise `<topic_prefix>/<service>` or
    `<topic_prefix>/<source>`. Retained.
  fields:
    service:
      name: Service
      description: >-
        Optional service identifier. Combined with `source` to form the
        dedup key. Must match `[A-Za-z0-9_-]+`.
      example: homeassistant
      selector:
        text:
    source:
      name: Source
      description: >-
        Optional sub-source identifier. Reuse it to supersede a previous
        status. Must match `[A-Za-z0-9_-]+`. At least one of `service`
        or `source` is required.
      example: front_door
      selector:
        text:
    level:
      name: Level
      description: Severity of the status.
      required: true
      selector:
        select:
          options:
            - OK
            - Info
            - Warning
            - Critical
    summary:
      name: Summary
      description: One-line summary, shown as the entry title.
      required: true
      example: Front door unlocked
      selector:
        text:
    details:
      name: Details
      description: >-
        Optional details. List of strings (preferred), or a single string
        (wrapped into a one-element list).
      example:
        - battery=78%
        - last_user=alice
      selector:
        object:
    alert_markdown:
      name: Alert markdown
      description: Optional markdown rendered into the MOTD alert sensor.
      example: "**Front door** unlocked"
      selector:
        text:
          multiline: true
    duration:
      name: Duration
      description: >-
        Optional message TTL. When set, the integration emits an
        `expires_at` field; the palantir consumer drops the entry once
        the deadline passes.
      example: "00:05:00"
      selector:
        duration:
    url:
      name: URL
      description: >-
        Optional URL the rendered MOTD title links to. When the message
        also carries `actions`, this is the URL the push notification
        opens when tapped. Emitted on the wire as `link`.
      example: https://home.example.com/lovelace/security
      selector:
        text:
    actions:
      name: Actions
      description: >-
        Optional list of actionable-notification buttons. Presence of
        `actions` makes palantir fire a push notification to its
        configured targets. Each action is a mapping with `action` and
        `title` (required) plus optional `uri`, `icon`, and
        `destructive`. Use `action: URI` with `uri` to open a URL or
        dashboard path. The contract is identical on iOS and Android.
      example:
        - action: URI
          title: Open camera
          uri: https://home.example.com/lovelace/cameras
        - action: DISMISS_ALERT
          title: Dismiss
          destructive: true
      selector:
        object:

